[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memanto-mcp"
version = "0.2.0"
description = "Typed semantic memory for Claude. An MCP server with opinions, designed for regulated B2B agents."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Geoff" }]
keywords = ["mcp", "memory", "memanto", "moorcheh", "rag", "anthropic", "claude", "agentic-memory", "semantic-memory"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=1.0,<2",
    "memanto>=0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "black>=24",
]

[project.urls]
Homepage = "https://github.com/geoffsdesk/memanto-mcp"
Repository = "https://github.com/geoffsdesk/memanto-mcp"
Issues = "https://github.com/geoffsdesk/memanto-mcp/issues"
Changelog = "https://github.com/geoffsdesk/memanto-mcp/blob/main/CHANGELOG.md"

[project.scripts]
memanto-mcp = "memanto_mcp_server:main"

[tool.hatch.build.targets.wheel]
# Ship server/memanto_mcp_server.py as the top-level module the console
# script imports (memanto_mcp_server:main), not as a "server" package.
only-include = ["server/memanto_mcp_server.py"]
sources = ["server"]
